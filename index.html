<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col items-center justify-center min-h-screen p-4">
  <h1 class="text-3xl font-bold mb-4">Simple JSON Search</h1>

  <input
    id="searchInput"
    type="text"
    placeholder="Enter key to search..."
    class="px-4 py-2 border rounded-md w-full max-w-md mb-4"
  />
  <button
    onclick="searchKey()"
    class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700"
  >
    Search
  </button>

  <p id="result" class="mt-6 text-lg font-medium text-center"></p>

  <script>
    let jsonData = {};

    // Load JSON data on page load
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        jsonData = data;
      })
      .catch(error => {
        document.getElementById('result').textContent = 'Failed to load data.json.';
      });

    function searchKey() {
      const key = document.getElementById('searchInput').value.trim();
      const resultEl = document.getElementById('result');

      if (!key) {
        resultEl.textContent = "Please enter a key to search.";
        return;
      }

      if (key in jsonData) {
        resultEl.textContent = `"${key}" found: ${jsonData[key]}`;
      } else {
        resultEl.textContent = `"${key}" not found.`;
      }
    }
  </script>
</body>
</html>
