<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hash Verifier</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col items-center justify-center min-h-screen p-4">
  <h1 class="text-3xl font-bold mb-4">Document Hash Verifier</h1>

  <input
    id="hashInput"
    type="text"
    placeholder="Enter your document hash..."
    class="px-4 py-2 border rounded-md w-full max-w-md mb-4"
  />
  <button
    onclick="verifyHash()"
    class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700"
  >
    Verify
  </button>

  <p id="result" class="mt-6 text-lg font-medium text-center"></p>

  <script>
    let hashDatabase = {};

    // Load JSON data
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        hashDatabase = data;
      })
      .catch(error => {
        document.getElementById('result').textContent = 'Error loading hash database.';
      });

    function verifyHash() {
      const input = document.getElementById('hashInput').value.trim();
      const resultEl = document.getElementById('result');

      if (!input) {
        resultEl.textContent = "Please enter a hash.";
        return;
      }

      if (input in hashDatabase) {
        resultEl.textContent = `✅ Success! The doc title is: ${hashDatabase[input]}`;
        resultEl.className = "mt-6 text-green-700 font-semibold text-center";
      } else {
        resultEl.textContent = `❌ Hash not found.`;
        resultEl.className = "mt-6 text-red-700 font-semibold text-center";
      }
    }
  </script>
</body>
</html>
